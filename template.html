<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="900">
<meta name="author" content="Lavidas">
<meta name="robots" content="noindex, nofollow">
<title>Αγώνες σήμερα</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=GFS+Neohellenic:400,700&amp;subset=greek">
<style>
html, body { margin: 0; padding: 0; background: #ffffff; color: #1a1a1a; }
body { font-family: "GFS Neohellenic", Georgia, "Times New Roman", serif; padding: 12px 18px; }
h1 { font-size: 30px; font-weight: 700; color: #0E8388; margin: 0; padding-bottom: 6px; border-bottom: 2px solid #0E8388; }
p.plan { font-size: 21px; margin: 6px 0 4px 0; color: #333333; }
p.plan b { color: #0E8388; }
table.games { width: 100%; border-collapse: collapse; }
table.games td { border-bottom: 1px solid #0E8388; padding: 5px 8px; vertical-align: middle; }
td.time { font-size: 30px; font-weight: 700; white-space: nowrap; width: 1%; }
td.ch { white-space: nowrap; width: 1%; text-align: center; padding-left: 12px; padding-right: 12px; }
.num { font-size: 40px; font-weight: 700; color: #0E8388; }
tr.other .num { color: #555555; font-size: 32px; }
tr.other td.time { font-size: 24px; color: #555555; }
.unknown { font-size: 20px; font-weight: 700; color: #A80030; }
.match { font-size: 27px; font-weight: 700; }
tr.other .match { font-size: 22px; font-weight: 400; }
.meta { font-size: 18px; color: #666666; }
.switch { font-size: 18px; font-weight: 700; color: #0E8388; }
tr.past { display: none; }
tr.now td.time { color: #0E8388; }
div.day { display: none; }
p.empty, p.done { font-size: 30px; line-height: 1.3; margin: 30px 0; }
p.done { display: none; }
p.foot { font-size: 16px; color: #777777; margin-top: 10px; }
@media (max-height: 620px) {
  body { padding: 6px 12px; }
  h1 { font-size: 24px; padding-bottom: 3px; }
  p.plan { font-size: 18px; margin: 3px 0; }
  table.games td { padding: 2px 6px; }
  td.time { font-size: 24px; }
  .num { font-size: 32px; }
  tr.other .num { font-size: 26px; }
  tr.other td.time { font-size: 20px; }
  .match { font-size: 22px; }
  tr.other .match { font-size: 19px; }
  .meta, .switch { font-size: 15px; }
}
</style>
</head>
<body>
{{DAYS}}
<p class="empty" id="stale" style="display:none">Το πρόγραμμα δεν έχει ενημερωθεί. Η σελίδα θα ενημερωθεί μόνη της.</p>
<p class="foot">{{FOOTER}}</p>
<script>
(function () {
  function mins(s) { var p = s.split(":"); var m = parseInt(p[0], 10) * 60 + parseInt(p[1], 10); return m < 300 ? m + 1440 : m; }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  var d = new Date();
  var now = d.getHours() * 60 + d.getMinutes();
  var key = d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  var divs = document.getElementsByTagName("div"), day = null, i;
  for (i = 0; i < divs.length; i++) {
    if (divs[i].className === "day" && divs[i].getAttribute("data-date") === key) { day = divs[i]; }
  }
  if (!day) { var st = document.getElementById("stale"); if (st && divs.length) { st.style.display = "block"; } return; }
  day.style.display = "block";
  if (now < 300) { now = now + 1440; }
  var rows = day.getElementsByTagName("tr"), shown = 0, total = 0;
  for (i = 0; i < rows.length; i++) {
    var t = rows[i].getAttribute("data-t");
    if (!t) { continue; }
    total++;
    var s = mins(t), e = mins(rows[i].getAttribute("data-e"));
    if (e < s) { e = e + 1440; }
    if (now >= e) { rows[i].className += " past"; }
    else { shown++; if (now >= s) { rows[i].className += " now"; } }
  }
  if (total > 0 && shown === 0) {
    var ps = day.getElementsByTagName("p");
    for (i = 0; i < ps.length; i++) { if (ps[i].className === "done") { ps[i].style.display = "block"; } }
  }
})();
</script>
</body>
</html>
